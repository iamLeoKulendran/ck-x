<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistakes & Retests | CK-X</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/tools-pages.css">
</head>
<body class="tools-page">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">CK-X Cloud</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/analytics.html">Analytics</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/mistakes.html" aria-current="page">Mistakes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/packs.html">Packs</a></li>
                    <li class="nav-item"><a class="nav-link" href="/settings.html">Settings</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container tools-container tools-container--wide">
        <header class="tools-header">
            <h1>Mistakes &amp; Retests</h1>
            <p class="text-muted">A mistake is resolved only when you completed a correction <em>and</em> the latest retest passed.
               Logging one, fixing one, and re-proving one are tracked separately.</p>
        </header>

        <div class="row g-3 mb-3" id="mistakeCounters"></div>

        <section class="card tools-card" aria-labelledby="retestQueueHeading">
            <div class="card-body">
                <h2 class="h5" id="retestQueueHeading">Retest queue</h2>
                <div id="retestQueue"></div>
            </div>
        </section>

        <div class="d-flex gap-2 align-items-center mb-3 flex-wrap">
            <label class="form-label mb-0" for="categoryFilter">Category</label>
            <select class="form-select w-auto" id="categoryFilter">
                <option value="">All</option>
            </select>
            <label class="form-label mb-0" for="resolvedFilter">Status</label>
            <select class="form-select w-auto" id="resolvedFilter">
                <option value="">All</option>
                <option value="false">Unresolved</option>
                <option value="true">Resolved</option>
            </select>
        </div>

        <div class="tools-status" id="mistakesStatus" role="status">Loading mistakes…</div>
        <div id="mistakesList"></div>
    </main>

    <footer class="app-footer">
        <p class="text-center">&copy; <span id="currentYear"></span> CK-X Simulator.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/mistakes.js"></script>
</body>
</html>
