<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | CK-X</title>
    <link rel="icon" type="image/svg+xml" href="/assets/ckx-mark.svg">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/ckx-theme.css">
    <style>
        body.ckx {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            max-width: 600px;
            padding: 2rem;
            background-color: var(--ckx-surface);
            border: 1px solid var(--ckx-border);
            border-radius: var(--ckx-radius-lg);
            box-shadow: var(--ckx-shadow-lg);
            text-align: center;
        }
        .error-icon {
            font-size: 5rem;
            color: var(--ckx-bad);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="ckx">
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1 class="mb-4">Server Error</h1>
        <p class="lead mb-4">Sorry, something went wrong on our server. Please try again later.</p>
        <a href="/" class="btn btn-primary">Go back to home page</a>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
